<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Admin Login</h2>

    <input type="text" id="username" placeholder="Username"><br><br>
    <input type="password" id="password" placeholder="Password"><br><br>

    <button onclick="login()">Login</button>

    <p id="error" style="color:red;"></p>
</div>

<script>
async function login() {
    const usernameInput = document.getElementById("username").value;
    const passwordInput = document.getElementById("password").value;
    const error = document.getElementById("error");

    error.innerText = ""; // clear previous error

    try {
        const res = await fetch("https://eict-job-portal-backend.onrender.com/admin/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: usernameInput,
                password: passwordInput
            })
        });

        const data = await res.json();

        if (data.token) {
            localStorage.setItem("token", data.token);
            window.location.href = "admin.html";
        } else {
            error.innerText = "Invalid username or password";
        }

    } catch (err) {
        error.innerText = "Server error. Try again.";
    }
}
</script>

<footer style="text-align:center; padding:20px; margin-top:40px; background:#111; color:white;">
    <p>© 2026 EICT Job Portal | Built by Emmanuel King Christopher</p>
</footer>

</body>
</html>
