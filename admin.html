<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <title>Admin Dashboard</title>
</head>

<body>

    <!-- SIDEBAR + MAIN LAYOUT WRAPPER -->
    <div class="admin-layout">

        <!-- SIDEBAR -->
        <div class="sidebar">
            <h2>EICT Admin</h2>

            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="admin.html" class="active">Applications</a>

            <button onclick="toggleDarkMode()" id="darkBtn">🌙</button>
            <button onclick="logout()">Logout</button>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main">

            <h1>All Job Applications</h1>

            <!-- TEAM SECTION -->
            <h2>Add Team Member</h2>

            <input id="teamName" placeholder="Name">
            <input id="teamRole" placeholder="Role">
            <input id="teamImage" placeholder="Image URL">

            <button onclick="addTeam()">Add</button>

            <!-- SEARCH -->
            <input type="text" id="searchInput" placeholder="Search by name...">

            <!-- DASHBOARD STATS -->
            <div class="stats-grid">

                <div class="stats-card">
                    <h3>Total Applications</h3>
                    <p id="totalApps">0</p>
                </div>

                <div class="stats-card">
                    <h3>Frontend</h3>
                    <p id="frontendCount">0</p>
                </div>

                <div class="stats-card">
                    <h3>Backend</h3>
                    <p id="backendCount">0</p>
                </div>

                <div class="stats-card">
                    <h3>Full Stack</h3>
                    <p id="fullstackCount">0</p>
                </div>

            </div>

            <!-- APPLICATIONS -->
            <div id="applications"></div>

        </div>

    </div>

    <!-- EDIT MODAL -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h2>Edit Application</h2>

            <input type="text" id="editName" placeholder="Name">
            <input type="email" id="editEmail" placeholder="Email">
            <input type="text" id="editPosition" placeholder="Position">

            <button onclick="saveEdit()">Save</button>
            <button onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="admin.js"></script>

    <script>
        // 🔐 PROTECT PAGE
        if (localStorage.getItem("auth") !== "true") {
            window.location.href = "login.html";
        }

        // 🚪 LOGOUT
        function logout() {
            localStorage.removeItem("auth");
            window.location.href = "login.html";
        }
    </script>

    <!-- FOOTER -->
    <footer style="text-align:center; padding:20px; margin-top:40px; background:#111; color:white;">
        <p>© 2026 EICT Job Portal | Built by Emmanuel King Christopher</p>
    </footer>

</body>
</html>
